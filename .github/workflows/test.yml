name: Tests

# Fast quality gate. The platform build workflows repeat these checks so a
# failing suite cannot produce an artifact, but this job reports in about a
# minute instead of waiting on Gradle or Xcode.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run format check
        run: npm run format:check

      # Jest runs transpile-only, so type errors surface here rather than in
      # the suite. This also covers the test files themselves.
      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test -- --ci
