name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test -- --ci

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: gem install cocoapods

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Install iOS dependencies
        working-directory: ios
        run: pod install

      # prebuild names the project after expo.name ("Hulls & Hellfire" ->
      # HullsHellfire), not after the URL scheme. Reading it back off disk keeps
      # this job working the next time the app is renamed.
      - name: Resolve Xcode workspace
        id: xcode
        working-directory: ios
        run: |
          name="$(ls -d *.xcworkspace | head -1)"
          echo "workspace=$name" >> "$GITHUB_OUTPUT"
          echo "scheme=${name%.xcworkspace}" >> "$GITHUB_OUTPUT"

      - name: Build for iOS
        working-directory: ios
        run: |
          xcodebuild \
            -workspace '${{ steps.xcode.outputs.workspace }}' \
            -scheme '${{ steps.xcode.outputs.scheme }}' \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload iOS Simulator Build
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-build
          path: ios/build/Build/Products/Release-iphonesimulator/${{ steps.xcode.outputs.scheme }}.app
